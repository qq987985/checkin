name: 签到 · Test and Publish
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/qq987985/checkin
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test application and Compose
        env:
          ADMIN_TOKEN: ci-test-admin-token
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile checkin.py
          node --check static/app.js
          docker compose config --quiet
      - name: Build and smoke-test container
        run: |
          docker build -t checkin:smoke .
          docker run -d --name checkin-smoke -e ADMIN_TOKEN=ci-test-admin-token -p 127.0.0.1:18765:8765 checkin:smoke
          python - <<'PY'
          import json, time
          from urllib.request import Request, urlopen
          for attempt in range(30):
              try:
                  with urlopen('http://127.0.0.1:18765/', timeout=2) as response:
                      assert '签到'.encode() in response.read()
                  request = Request('http://127.0.0.1:18765/api/config', headers={'Authorization': 'Bearer ci-test-admin-token'})
                  with urlopen(request, timeout=2) as response:
                      assert json.load(response)['sites'] == []
                  print('Container startup and authenticated API passed')
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
          docker stop checkin-smoke
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 and arm64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=签到
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
