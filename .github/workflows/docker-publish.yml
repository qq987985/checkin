name: 签到 · Test and Publish
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/qq987985/checkin
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test application and Compose
        env:
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-test-password-123456
          COOKIE_SECURE: "false"
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python -m py_compile checkin.py
          node --check static/app.js
          docker compose config --quiet
      - name: Build and smoke-test container
        run: |
          docker build -t checkin:smoke .
          docker run -d --name checkin-smoke -e ADMIN_USERNAME=ci-admin -e ADMIN_PASSWORD=ci-test-password-123456 -e COOKIE_SECURE=false -p 127.0.0.1:18505:8505 checkin:smoke
          python - <<'PY'
          import json, time
          from urllib.request import Request, urlopen, build_opener, HTTPCookieProcessor
          from http.cookiejar import CookieJar
          for attempt in range(30):
              try:
                  with urlopen('http://127.0.0.1:18505/', timeout=2) as response:
                      assert '签到'.encode() in response.read()
                  opener = build_opener(HTTPCookieProcessor(CookieJar()))
                  request = Request('http://127.0.0.1:18505/api/login', data=json.dumps({'username':'ci-admin','password':'ci-test-password-123456'}).encode(), headers={'Content-Type':'application/json'})
                  with opener.open(request, timeout=2) as response:
                      assert json.load(response)['ok']
                  with opener.open('http://127.0.0.1:18505/api/config', timeout=2) as response:
                      assert json.load(response)['sites'] == []
                  print('Container startup and authenticated API passed')
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
          docker exec checkin-smoke python -c "from Crypto.Cipher import AES; import cookiecloud; import notifications"
          docker stop checkin-smoke
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 and arm64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=签到
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
